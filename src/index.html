<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14245e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f3a8f'/%3E%3Cpath d='M16 3l11 21H5z' fill='%2333b35a' stroke='%231d2b5c' stroke-width='2' stroke-linejoin='round'/%3E%3Crect x='13' y='24' width='6' height='5' fill='%23a8693a'/%3E%3Ccircle cx='13' cy='17' r='2' fill='%23e8423f'/%3E%3Ccircle cx='19' cy='20' r='2' fill='%23ffc233'/%3E%3C/svg%3E">
<title>Найди отличия: Новый год</title>
<!-- VK Bridge подключается и инициализируется первым, до загрузки остальных ресурсов -->
<script src="js/vk-bridge.min.js"></script>
<script src="js/platform.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>

<div id="app">
  <!-- Загрузка -->
  <section class="screen active" id="scr-loading">
    <div class="loader"><div class="loader-flake"></div><div class="loader-text">Загрузка…</div></div>
  </section>

  <!-- Главное меню -->
  <section class="screen" id="scr-menu">
    <div class="menu-top">
      <h1 class="title"><span class="t1">Найди отличия</span><span class="t2">Новый год</span></h1>
    </div>
    <div class="menu-art" id="menu-art"></div>
    <div class="menu-buttons">
      <button class="btn btn-red btn-big" id="btn-play">Играть</button>
      <div class="menu-sub" id="menu-sub"></div>
      <div class="menu-row">
        <button class="btn-round" id="btn-sound" aria-label="Звук"></button>
        <button class="btn btn-blue" id="btn-levels">Уровни</button>
        <button class="btn-round" id="btn-music" aria-label="Музыка"></button>
      </div>
    </div>
  </section>

  <!-- Выбор уровня -->
  <section class="screen" id="scr-levels">
    <header class="bar">
      <button class="btn-round" id="btn-levels-back" aria-label="Назад"></button>
      <div class="bar-title">Уровни</div>
      <div class="bar-stars" id="total-stars"></div>
    </header>
    <div class="levels-scroll"><div class="levels-grid" id="levels-grid"></div></div>
  </section>

  <!-- Игра -->
  <section class="screen" id="scr-game">
    <header class="bar">
      <button class="btn-round" id="btn-pause" aria-label="Пауза"></button>
      <div class="bar-center">
        <div class="bar-title" id="game-title">Уровень 1</div>
        <div class="found" id="found"></div>
      </div>
      <button class="btn-round btn-hint" id="btn-hint" aria-label="Подсказка"><span class="badge" id="hint-count">3</span></button>
    </header>
    <div class="board" id="board">
      <div class="pic" id="pic-a"><svg viewBox="0 0 400 340" preserveAspectRatio="xMidYMid meet"></svg></div>
      <div class="pic" id="pic-b"><svg viewBox="0 0 400 340" preserveAspectRatio="xMidYMid meet"></svg></div>
    </div>
  </section>

  <!-- Модальные окна -->
  <div class="modal" id="modal-win">
    <div class="card">
      <div class="card-ribbon">Отлично!</div>
      <div class="stars" id="win-stars"></div>
      <div class="card-text" id="win-text"></div>
      <button class="btn btn-red btn-big" id="btn-next">Дальше</button>
      <button class="btn btn-blue" id="btn-win-menu">В меню</button>
    </div>
  </div>

  <div class="modal" id="modal-pause">
    <div class="card">
      <div class="card-ribbon">Пауза</div>
      <div class="toggles">
        <button class="btn-round" id="btn-sound2" aria-label="Звук"></button>
        <button class="btn-round" id="btn-music2" aria-label="Музыка"></button>
      </div>
      <button class="btn btn-red btn-big" id="btn-resume">Продолжить</button>
      <button class="btn btn-blue" id="btn-restart">Начать заново</button>
      <button class="btn btn-blue" id="btn-pause-menu">В меню</button>
    </div>
  </div>

  <div class="modal" id="modal-hint">
    <div class="card">
      <div class="card-ribbon">Подсказки</div>
      <div class="hint-art" id="hint-art"></div>
      <div class="card-text">Подсказки закончились. Посмотрите короткую рекламу и получите ещё&nbsp;3!</div>
      <button class="btn btn-gold btn-big" id="btn-hint-ad">Получить +3</button>
      <button class="btn btn-blue" id="btn-hint-close">Не сейчас</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="js/art.js"></script>
<script src="js/levels.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
